name: CMake Build for macOS

on:
  workflow_dispatch:  # 允许手动触发，便于按需编译
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release  # 编译类型，设为 Release 以获得最优性能

jobs:
  build-on-macos:
    runs-on: macos-latest  # 指定在最新版 macOS 环境上运行
    steps:
      - uses: actions/checkout@v4  # 第一步：拉取你的仓库代码
        with:
          submodules: 'recursive'  # 如果项目有子模块，递归拉取

      - name: Install dependencies (macOS)  # 第二步：安装编译依赖
        run: |
          brew install cmake  # 通过 Homebrew 安装 CMake

      - name: Configure CMake  # 第三步：配置 CMake 项目，生成 Makefile
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build  # 第四步：执行编译命令，生成二进制文件
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Upload artifact  # 第五步：将编译成果物打包并上传
        uses: actions/upload-artifact@v4
        with:
          name: EasyGBD-macOS
          path: ${{github.workspace}}/build  # 打包 build 文件夹下的所有文件
